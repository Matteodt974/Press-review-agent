  - {media: Globe and Mail, url: "https://www.theglobeandmail.com/arc/outboundfeeds/rss/category/canada/"}
  - {media: Globe and Mail, url: "https://www.theglobeandmail.com/arc/outboundfeeds/rss/category/politics/"}
  - {media: CTV News, url: "https://www.ctvnews.ca/rss/ctvnews-ca-canada-public-rss-1.822284"}
  - {media: CTV News, url: "https://www.ctvnews.ca/rss/ctvnews-ca-montreal-public-rss-1.822366"}
  - {media: Global News, url: "https://globalnews.ca/canada/feed/"}
  - {media: Global News, url: "https://globalnews.ca/montreal/feed/"}
  - {media: Global News, url: "https://globalnews.ca/crime/feed/"}

google_news:
  # Seuls les résultats de ces domaines sont gardés (médias fiables).
  domains:
    ici.radio-canada.ca: Radio-Canada
    radio-canada.ca: Radio-Canada
    lapresse.ca: La Presse
    ledevoir.com: Le Devoir
    journaldemontreal.com: Journal de Montréal
    journaldequebec.com: Journal de Québec
    tvanouvelles.ca: TVA Nouvelles
    noovo.info: Noovo Info
    cbc.ca: CBC
    theglobeandmail.com: Globe and Mail
    ctvnews.ca: CTV News
    globalnews.ca: Global News
    thecanadianpressnews.ca: La Presse Canadienne
  # Noms de source acceptés même si le domaine diffère
  source_names:
    - La Presse Canadienne
    - The Canadian Press
  queries_fr:
    - 'employé accusé (consulté OR "données personnelles" OR dossiers)'
    - 'policier accusé ("crime organisé" OR motards OR "abus de confiance")'
    - '(candidat OR élu OR conseiller) ("casier judiciaire" OR "Hells Angels" OR antécédents)'
    - '"vérification des antécédents" OR "habilitation de sécurité" OR "cote de sécurité"'
    - 'employé congédié (fraude OR "accès non autorisé") banque'
    - 'intrusion (école OR CPE OR garderie)'
    - '"faux médecin" OR "fausse infirmière" OR "se faisait passer pour"'
    - 'détenu "libéré par erreur"'
    - 'fonctionnaire ("ingérence étrangère" OR espionnage)'
    - 'employé aéroport (drogue OR importation OR cocaïne) accusé'
  queries_en:
    - 'employee charged accessed ("personal information" OR records) Canada'
    - 'police officer charged "organized crime" Canada'
    - '"background check" OR "security clearance" OR vetting failure Canada'
    - 'airport worker charged smuggling Canada'
    - 'inmate "released in error" Canada'
    - '"foreign interference" OR espionage public servant charged Canada'
    - 'fake nurse OR doctor impostor charged Canada'

report:
  # Annexe listant les articles écartés par l'IA (utile pour valider
  # le filtre pendant la phase préliminaire)
  annexe_exclus: true
  annexe_exclus_max: 60
  timezone: America/Toronto
