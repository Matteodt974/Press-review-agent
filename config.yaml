  # Recherche Google News par flux RSS (gratuit, remonte plus loin que
  # les flux des médias). Zone grise côté conditions d'utilisation :
  # mets false pour désactiver.
  google_news: true
  timeout_seconds: 20

# Flux RSS des médias. ATTENTION : URL non testées depuis l'environnement
# de développement (réseau bloqué). Lance :  RevueSecurite.exe --verifier-flux
# (ou python main.py --verifier-flux) et retire/corrige ceux en échec.
feeds:
  - {media: Radio-Canada, url: "https://ici.radio-canada.ca/rss/4159"}
  - {media: La Presse, url: "https://www.lapresse.ca/actualites/rss"}
  - {media: La Presse, url: "https://www.lapresse.ca/actualites/justice-et-faits-divers/rss"}
  - {media: La Presse, url: "https://www.lapresse.ca/actualites/politique/rss"}
  - {media: Le Devoir, url: "https://www.ledevoir.com/rss/manchettes.xml"}
  - {media: Le Devoir, url: "https://www.ledevoir.com/rss/section/societe.xml"}
  - {media: Journal de Montréal, url: "https://www.journaldemontreal.com/rss.xml"}
  - {media: Journal de Montréal, url: "https://www.journaldemontreal.com/actualite/rss.xml"}
  - {media: Journal de Québec, url: "https://www.journaldequebec.com/actualite/rss.xml"}
  - {media: TVA Nouvelles, url: "https://www.tvanouvelles.ca/rss.xml"}
  - {media: Noovo Info, url: "https://www.noovo.info/rss.xml"}
  - {media: CBC, url: "https://www.cbc.ca/webfeed/rss/rss-canada"}
  - {media: CBC, url: "https://www.cbc.ca/webfeed/rss/rss-canada-montreal"}
