# =====================================================================
#  Configuration — Agent revue de presse « briefs de sécurité »
# =====================================================================

llm:
  # "anthropic" (Claude) ou "openai"
  provider: anthropic
  # Colle ta clé ici. Si vide, la variable d'environnement
  # ANTHROPIC_API_KEY (ou OPENAI_API_KEY) est utilisée.
  api_key: ""
  # Modèle bon marché pour le tri (beaucoup d'appels)
  model_classify: claude-haiku-5-5
  # Modèle plus fort pour regrouper les doublons et rédiger les résumés
  model_write: claude-opus-5-5
  # Effort de raisonnement (Claude) : low / medium / high
  effort_classify: low
  effort_write: medium
  # Nombre d'articles envoyés par appel de classification
  batch_size: 15
  # Appels de classification en parallèle
  parallel_calls: 4

window:
  # Ne jamais remonter plus loin que N jours (aussi au 1er lancement)
  max_days: 30

prefilter:
  # Filtre mots-clés large AVANT le LLM (réduit le coût).
  # Mets false pour tout envoyer au LLM (plus cher, meilleur rappel).
  use_keywords: true
  # Plafond d'articles envoyés au LLM par lancement (protection du coût)
  max_candidates: 400
  # Accents et majuscules ignorés ; correspondance en début de mot.
  keywords:
    # --- FR ---
    - employé
    - ex-employé
    - ancien employé
    - employée
    - fonctionnaire
    - policier
    - policière
    - agent
    - agente
    - enquêteur
    - élu
    - candidat
    - maire
    - conseiller
    - conseillère
    - ministre
    - député
    - enseignant
    - entraîneur
    - éducatrice
    - accusé
    - accusations
    - congédié
    - suspendu
    - inculpé
    - arrêté
    - fraude
    - abus de confiance
    - corruption
    - crime organisé
    - hells
    - motard
    - mafia
    - gang de rue
    - antécédents
    - casier judiciaire
    - vérification
    - habilitation
    - cote de sécurité
    - filtrage
    - données personnelles
    - renseignements personnels
    - dossiers
    - consulté
    - fuite
    - ingérence
    - espion
    - aéroport
    - douane
    - importation
    - intrusion
    - intrus
    - école
    - cpe
    - garderie
    - faux médecin
    - fausse infirmière
    - usurpation
    - se faisait passer
    - libéré par erreur
    - vérificateur général
    - saaq
    - revenu québec
    - upac
    - desjardins
    - banque
    # --- EN ---
    - employee
    - worker
    - officer
    - police
    - public servant
    - councillor
    - candidate
    - teacher
    - coach
    - charged
    - fired
    - accused
    - fraud
    - breach of trust
    - organized crime
    - background check
    - security clearance
    - screening
    - vetting
    - insider
    - privacy breach
    - personal information
    - foreign interference
    - espionage
    - airport
    - cbsa
    - smuggling
    - intruder
    - daycare
    - impostor
    - fake doctor
    - fake nurse
    - released in error
    - mistakenly released
    - auditor general
    - bribery
    - criminal record

sources:
